<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ruth Eunice Collection - Catálogo</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background-color: #f9f9f9; color: #333; }
        header { background-color: #fff; padding: 15px 20px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #ddd; }
        .logo { height: 50px; }
        .container { max-width: 1200px; margin: 20px auto; padding: 0 20px; }
        .product-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; }
        .product-card { background: #fff; border: 1px solid #ddd; border-radius: 8px; overflow: hidden; padding: 15px; text-align: center; }
        .product-img { width: 100%; height: 300px; object-fit: cover; border-radius: 4px; }
        .product-title { font-size: 18px; margin: 10px 0 5px; }
        .product-price { font-size: 16px; color: #b12704; font-weight: bold; margin-bottom: 10px; }
        .btn-whatsapp-buy { background-color: #25d366; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; font-size: 14px; font-weight: bold; width: 100%; }
        .btn-whatsapp-buy:hover { background-color: #1ebe5d; }
    </style>
</head>
<body>

    <header>
        <img src="logoruth.png" alt="Logo" class="logo">
        <h2>Catálogo de Prendas</h2>
    </header>

    <div class="container">
        <div class="product-grid">
            
            <!-- PRODUCTO 1 -->
            <div class="product-card" data-category="conjuntos-cortos">
                <img src="foto(2).jpeg" alt="Conjunto Bruna" class="product-img">
                <h3 class="product-title">Conjunto Bruna</h3>
                <div class="product-price">320 Bs</div>
                <button class="btn-whatsapp-buy" onclick="showProductDetail('Conjunto Bruna', 320, 'AZUL', 'M', 'foto(2).jpeg')">Comprar por WhatsApp</button>
            </div>

            <!-- PRODUCTO 2 (LENCERÍA) -->
            <div class="product-card" data-category="lenceria">
                <img src="foto(3).jpeg" alt="Conjunto Chenoa" class="product-img">
                <h3 class="product-title">Conjunto Chenoa</h3>
                <div class="product-price">300 Bs</div>
                <button class="btn-whatsapp-buy" onclick="showProductDetail('Conjunto Chenoa', 300, 'NEGRO', 'S', 'foto(3).jpeg')">Comprar por WhatsApp</button>
            </div>

        </div>
    </div>

    <script>
        function showProductDetail(nombre, precio, color, talle, imagen) {
            let telefono = "59170000000"; // Cambia esto por tu número de WhatsApp
            let mensaje = `Hola, quiero comprar el producto *${nombre}* (Precio: ${precio} Bs, Color: ${color}, Talle: ${talle}).`;
            let url = `https://wa.me/${telefono}?text=${encodeURIComponent(mensaje)}`;
            window.open(url, '_blank');
        }
    </script>

</body>
</html>
